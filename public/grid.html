<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniGuard - Multi-Device CCTV 4-Way Grid Viewer</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      background: #060911;
      padding: 0.5rem;
      color: #e2e8f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      margin: 0;
    }
    .grid-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 1rem;
      background: #0f172a;
      border-radius: 8px;
      margin-bottom: 0.5rem;
      border: 1px solid #1e293b;
    }
    .cctv-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 0.5rem;
      height: calc(100vh - 75px);
    }
    @media (max-width: 768px) {
      .cctv-grid {
        grid-template-columns: 1fr;
        height: auto;
      }
    }
    .cctv-cell {
      background: #000;
      border: 1px solid #1e293b;
      border-radius: 8px;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .cell-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      padding: 0.35rem 0.6rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      font-size: 0.75rem;
    }
    .video-feed {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    .cell-connect-form {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.95);
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid #334155;
      width: 240px;
      text-align: center;
      z-index: 5;
    }
  </style>
</head>
<body>

  <div class="grid-header">
    <div style="display: flex; align-items: center; gap: 0.5rem;">
      <span style="font-size: 1.25rem;">🔲</span>
      <span style="font-weight: 700; font-size: 0.95rem;">OmniGuard Multi-Screen CCTV 4-Way Fleet Console</span>
      <span class="badge" style="background: #10b981; font-size: 0.75rem;">Commercial Active</span>
    </div>
    <div style="display: flex; gap: 0.5rem;">
      <button onclick="location.reload()" class="btn btn-secondary" style="font-size: 0.75rem; padding: 0.3rem 0.6rem;">🔄 Refresh Grid</button>
      <a href="/" class="btn btn-primary" style="font-size: 0.75rem; padding: 0.3rem 0.6rem; text-decoration: none;">← Master Console</a>
    </div>
  </div>

  <div class="cctv-grid">
    
    <!-- Camera Box 1 -->
    <div class="cctv-cell" id="cell1">
      <div class="cell-bar">
        <span style="color: #38bdf8; font-weight: 700;">CH 1: Device / Cam 1</span>
        <span id="badge1" style="color: #94a3b8;">Offline</span>
      </div>
      <video id="vid1" class="video-feed" autoplay playsinline muted></video>
      <div class="cell-connect-form" id="form1">
        <div style="font-size: 0.8rem; font-weight: 700; margin-bottom: 0.5rem; color: #38bdf8;">Connect Channel 1</div>
        <input type="text" id="id1" class="input-box" placeholder="Partner ID (9 Digits)" style="padding: 0.3rem; font-size: 0.8rem; margin-bottom: 0.4rem;">
        <input type="password" id="pwd1" class="input-box" placeholder="Password" style="padding: 0.3rem; font-size: 0.8rem; margin-bottom: 0.5rem;">
        <button onclick="connectChannel(1)" class="btn btn-primary" style="font-size: 0.75rem; padding: 0.4rem; width: 100%;">Connect</button>
      </div>
    </div>

    <!-- Camera Box 2 -->
    <div class="cctv-cell" id="cell2">
      <div class="cell-bar">
        <span style="color: #34d399; font-weight: 700;">CH 2: Device / Cam 2</span>
        <span id="badge2" style="color: #94a3b8;">Offline</span>
      </div>
      <video id="vid2" class="video-feed" autoplay playsinline muted></video>
      <div class="cell-connect-form" id="form2">
        <div style="font-size: 0.8rem; font-weight: 700; margin-bottom: 0.5rem; color: #34d399;">Connect Channel 2</div>
        <input type="text" id="id2" class="input-box" placeholder="Partner ID (9 Digits)" style="padding: 0.3rem; font-size: 0.8rem; margin-bottom: 0.4rem;">
        <input type="password" id="pwd2" class="input-box" placeholder="Password" style="padding: 0.3rem; font-size: 0.8rem; margin-bottom: 0.5rem;">
        <button onclick="connectChannel(2)" class="btn btn-primary" style="font-size: 0.75rem; padding: 0.4rem; width: 100%;">Connect</button>
      </div>
    </div>

    <!-- Camera Box 3 -->
    <div class="cctv-cell" id="cell3">
      <div class="cell-bar">
        <span style="color: #a78bfa; font-weight: 700;">CH 3: Device / Cam 3</span>
        <span id="badge3" style="color: #94a3b8;">Offline</span>
      </div>
      <video id="vid3" class="video-feed" autoplay playsinline muted></video>
      <div class="cell-connect-form" id="form3">
        <div style="font-size: 0.8rem; font-weight: 700; margin-bottom: 0.5rem; color: #a78bfa;">Connect Channel 3</div>
        <input type="text" id="id3" class="input-box" placeholder="Partner ID (9 Digits)" style="padding: 0.3rem; font-size: 0.8rem; margin-bottom: 0.4rem;">
        <input type="password" id="pwd3" class="input-box" placeholder="Password" style="padding: 0.3rem; font-size: 0.8rem; margin-bottom: 0.5rem;">
        <button onclick="connectChannel(3)" class="btn btn-primary" style="font-size: 0.75rem; padding: 0.4rem; width: 100%;">Connect</button>
      </div>
    </div>

    <!-- Camera Box 4 -->
    <div class="cctv-cell" id="cell4">
      <div class="cell-bar">
        <span style="color: #f59e0b; font-weight: 700;">CH 4: Device / Cam 4</span>
        <span id="badge4" style="color: #94a3b8;">Offline</span>
      </div>
      <video id="vid4" class="video-feed" autoplay playsinline muted></video>
      <div class="cell-connect-form" id="form4">
        <div style="font-size: 0.8rem; font-weight: 700; margin-bottom: 0.5rem; color: #f59e0b;">Connect Channel 4</div>
        <input type="text" id="id4" class="input-box" placeholder="Partner ID (9 Digits)" style="padding: 0.3rem; font-size: 0.8rem; margin-bottom: 0.4rem;">
        <input type="password" id="pwd4" class="input-box" placeholder="Password" style="padding: 0.3rem; font-size: 0.8rem; margin-bottom: 0.5rem;">
        <button onclick="connectChannel(4)" class="btn btn-primary" style="font-size: 0.75rem; padding: 0.4rem; width: 100%;">Connect</button>
      </div>
    </div>

  </div>

  <script>
    const channels = {};
    const rtcConfig = {
      iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
    };

    function connectChannel(chNum) {
      const id = document.getElementById(`id${chNum}`).value.trim();
      const pwd = document.getElementById(`pwd${chNum}`).value.trim();
      if (!id || !pwd) {
        alert('দয়া করে আইডি এবং পাসওয়ার্ড উভয়ই লিখুন।');
        return;
      }

      // Persist permanently for auto-reconnect
      try {
        localStorage.setItem(`grid_ch${chNum}_id`, id);
        localStorage.setItem(`grid_ch${chNum}_pwd`, pwd);
      } catch (e) {}

      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(`${protocol}//${window.location.host}`);
      
      const badge = document.getElementById(`badge${chNum}`);
      const form = document.getElementById(`form${chNum}`);
      const vid = document.getElementById(`vid${chNum}`);

      badge.textContent = 'Connecting...';
      badge.style.color = '#f59e0b';

      let pc = null;

      ws.onopen = () => {
        ws.send(JSON.stringify({
          type: 'REGISTER',
          data: { type: 'CONTROLLER', name: `Grid-Viewer-${chNum}` }
        }));
      };

      ws.onmessage = async (e) => {
        const msg = JSON.parse(e.data);

        if (msg.type === 'REGISTERED') {
          ws.send(JSON.stringify({
            type: 'CONNECT_REQUEST',
            data: { hostId: id, password: pwd, mode: 'CAMERA_SURVEILLANCE' }
          }));
        } else if (msg.type === 'CONNECT_ACCEPTED') {
          form.style.display = 'none';
          badge.textContent = `🟢 LIVE (${id})`;
          badge.style.color = '#10b981';

          pc = new RTCPeerConnection(rtcConfig);
          pc.addTransceiver('video', { direction: 'recvonly' });

          pc.ontrack = (event) => {
            if (event.track.kind === 'video') {
              vid.srcObject = event.streams[0];
            }
          };

          pc.onicecandidate = (event) => {
            if (event.candidate) {
              ws.send(JSON.stringify({
                type: 'ICE_CANDIDATE',
                data: { targetId: id, candidate: event.candidate }
              }));
            }
          };

          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);
          ws.send(JSON.stringify({
            type: 'OFFER',
            data: { targetId: id, sdp: offer }
          }));

        } else if (msg.type === 'ANSWER' && pc) {
          await pc.setRemoteDescription(new RTCSessionDescription(msg.data.sdp));
        } else if (msg.type === 'ICE_CANDIDATE' && pc && msg.data.candidate) {
          await pc.addIceCandidate(new RTCIceCandidate(msg.data.candidate));
        } else if (msg.type === 'CONNECT_ERROR') {
          alert(`CH ${chNum} Error: ${msg.error}`);
          badge.textContent = 'Failed';
          badge.style.color = '#ef4444';
        }
      };

      channels[chNum] = { ws, pc };
    }

    // Auto-restore and Auto-connect saved permanent cameras on grid load
    window.addEventListener('DOMContentLoaded', () => {
      for (let ch = 1; ch <= 4; ch++) {
        try {
          const savedId = localStorage.getItem(`grid_ch${ch}_id`);
          const savedPwd = localStorage.getItem(`grid_ch${ch}_pwd`);
          if (savedId) {
            const idInput = document.getElementById(`id${ch}`);
            if (idInput) idInput.value = savedId;
          }
          if (savedPwd) {
            const pwdInput = document.getElementById(`pwd${ch}`);
            if (pwdInput) pwdInput.value = savedPwd;
          }
          if (savedId && savedPwd) {
            setTimeout(() => { connectChannel(ch); }, ch * 400);
          }
        } catch (e) {}
      }
    });
  </script>
</body>
</html>
